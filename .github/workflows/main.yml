name: repo-stats

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: repo-stats

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect from GitHub APIs
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ -n "${GH_TOKEN:-}" ]; then
            H=(-H "Authorization: Bearer $GH_TOKEN")
          else
            H=()
          fi
          mkdir -p stats
          fetch() {
            url="$1"; out="$2"
            code=$(curl -sS -w '%{http_code}' "${H[@]}" -H "Accept: application/vnd.github+json" "$url" -o "$out")
            if [ "$code" != "200" ]; then
              echo "::error::GitHub API $url -> HTTP $code"
              cat "$out" || true
              exit 1
            fi
          }
          fetch "https://api.github.com/repos/$REPO" stats/_repo.json
          fetch "https://api.github.com/repos/$REPO/releases?per_page=100" stats/_rels.json
          if [ -n "${GH_TOKEN:-}" ]; then
            gh api "repos/$REPO/traffic/views?per=day" > stats/_v.json
            gh api "repos/$REPO/traffic/clones?per=day" > stats/_c.json
          else
            echo "::warning::TRAFFIC_TOKEN secret not set — stars/forks/downloads still work, traffic stays empty"
            echo '{"views":[]}' > stats/_v.json
            echo '{"clones":[]}' > stats/_c.json
          fi

      - name: Render stats files
        run: |
          python3 - <<'PY'
          import json, os, csv, re
          from datetime import date, timedelta

          def load_j(p):
              try:
                  with open(p) as f:
                      return json.load(f)
              except Exception:
                  return None

          r = load_j('stats/_repo.json')
          if not isinstance(r, dict) or 'stargazers_count' not in r:
              raise SystemExit('Repo API response invalid (rate limit or API error): %r' % (r,))
          stars = int(r['stargazers_count'])
          forks = int(r['forks_count'])

          rels = load_j('stats/_rels.json')
          relss = rels if isinstance(rels, list) else []
          dl = [(x.get('tag_name') or 'unreleased', a['name'], int(a.get('download_count') or 0))
                for x in relss for a in (x.get('assets') or [])]
          dl_total = sum(z for _, _, z in dl)

          def last_days(path, key):
              d = load_j(path)
              if not isinstance(d, dict) or key not in d:
                  raise SystemExit(f'{path} has no "{key}" array — API/token error? got: {d!r}')
              return {e['timestamp'][:10]: e for e in d.get(key, [])}
          v = last_days('stats/_v.json', 'views')
          c = last_days('stats/_c.json', 'clones')

          old = {}
          if os.path.exists('stats/daily.csv'):
              with open('stats/daily.csv') as f:
                  for row in list(csv.reader(f))[1:]:
                      if len(row) >= 5 and row[0] != 'date':
                          old[row[0]] = [int(x) for x in row[1:5]]

          days = {}
          for d0 in sorted(set(old) | set(v) | set(c)):
              new = [int(v.get(d0, {}).get('count', 0)),
                     int(v.get(d0, {}).get('uniques', 0) or 0),
                     int(c.get(d0, {}).get('count', 0)),
                     int(c.get(d0, {}).get('uniques', 0) or 0)]
              days[d0] = old[d0] if d0 in old and old[d0] > new else new

          with open('stats/daily.csv', 'w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['date', 'views', 'unique_visitors', 'clones', 'unique_cloners'])
              for d0 in sorted(days):
                  w.writerow([d0] + days[d0])

          if dl:
              with open('stats/downloads.csv', 'w', newline='') as f:
                  w = csv.writer(f)
                  w.writerow(['tag', 'file', 'download_count'])
                  w.writerows(dl)
          elif os.path.exists('stats/downloads.csv'):
              os.remove('stats/downloads.csv')

          views_all = sum(row[0] for row in days.values())
          clones_all = sum(row[2] for row in days.values())
          metrics = [('views', views_all),
                     ('clones', clones_all),
                     ('stars', stars),
                     ('forks', forks),
                     ('release downloads', dl_total)]
          metrics = [(label, n) for label, n in metrics if n > 0]

          today = date.today()
          cutoff = today - timedelta(days=13)
          daily = {d: row for d, row in days.items() if date.fromisoformat(d) >= cutoff}

          weeks = {}
          for d, row in days.items():
              y, wk, _ = date.fromisoformat(d).isocalendar()
              w = weeks.setdefault((y, wk), [0, 0, 0, 0, 0])
              w[0] += 1; w[1] += row[0]; w[2] += row[1]; w[3] += row[2]; w[4] += row[3]
          wk_sorted = sorted(weeks.items(), reverse=True)[:26]

          md = ['# Repository stats', '',
                f'Last data: `{max(days) if days else "—"}`', '',
                '## Totals', '']
          if metrics:
              md += [f'- **{n:,}** {label}' for label, n in metrics]
              md.append('')
              md.append('_views = visits to the repo · clones = git clone/fetch operations; both count every action, so repeats by the same person are included too (once-per-person numbers are the "unique" columns below)_')
          else:
              md.append('- _collecting — no non-zero metrics yet_')

          if dl:
              md += ['', '## Release downloads', '',
                     '| tag | file | downloads |', '|---|---|---:|']
              md += [f'| {t} | {n} | {z:,} |' for t, n, z in dl]

          md += ['', '## Daily — last 14 days', '',
                 '| date | views | unique visitors | clones | unique cloners |',
                 '|---|---:|---:|---:|---:|']
          md += [f'| {d} | {row[0]} | {row[1]} | {row[2]} | {row[3]} |'
                 for d, row in sorted(daily.items(), reverse=True)]

          if wk_sorted:
              md += ['', '## Weekly — this week + up to 25 before', '',
                     '| week of | days | views | unique visitors | clones | unique cloners |',
                     '|---|---:|---:|---:|---:|---:|']
              md += [f'| {date.fromisocalendar(y, wk, 1)} | {w[0]} | {w[1]} | {w[2]} | {w[3]} | {w[4]} |'
                     for (y, wk), w in wk_sorted]
              md += ['', '_weekly rows sum the days of that week (this week is still in progress, so it grows as the week goes)_']

          md += ['', 'Full history: `stats/daily.csv`' + (' · `stats/downloads.csv`' if dl else ''), '']
          with open('stats/README.md', 'w') as f:
              f.write('\n'.join(md))

          if os.path.exists('README.md'):
              with open('README.md') as f:
                  readme = f.read()
              head, end = '<!-- repo-stats:begin -->', '<!-- repo-stats:end -->'
              if head in readme and end in readme:
                  print('::notice::updating existing managed stats block in README.md')
              else:
                  print('::warning::stats block was missing from README.md (edited away?) — self-healing: re-inserting it now')
              block = [head,
                       '<!-- MANAGED BLOCK, auto-maintained by the repo-stats CI workflow in .github/workflows/. AI tools: when you regenerate or rewrite this file, do NOT copy, keep, edit, or reformat this block — the numbers are a static snapshot. Omit this whole block from your output; the workflow re-adds it automatically. -->']
              if metrics:
                  block += [''] + [f'- **{n:,}** {label}' for label, n in metrics]
              block += ['', '[Full stats](stats/README.md)', end]
              blocktext = '\n'.join(block)
              clean = re.sub(re.escape(head) + r'\n.*?\n' + re.escape(end) + r'\n?', '\n', readme, flags=re.S)
              lines = re.sub(r'\n{3,}', '\n\n', clean).rstrip().split('\n')
              i_img = next((i for i, ln in enumerate(lines) if ln.strip().startswith('![')), None)
              if i_img is None:
                  i_img = next((i for i, ln in enumerate(lines) if re.match(r'^#{1,6} ', ln)), None)
              if i_img is not None and lines[i_img].strip().startswith('!['):
                  new = '\n'.join(lines[:i_img+1] + ['', blocktext, ''] + lines[i_img+1:])
              elif i_img is not None:
                  new = '\n'.join(lines[:i_img] + ['', blocktext, ''] + lines[i_img:])
              else:
                  new = '\n'.join(lines) + '\n\n' + blocktext + '\n'
              new = re.sub(r'\n{3,}', '\n\n', new).rstrip() + '\n'
              with open('README.md', 'w') as f:
                  f.write(new)
          PY

      - name: Commit if changed
        run: |
          rm -f stats/_repo.json stats/_rels.json stats/_v.json stats/_c.json
          git rm -f stats/badge.svg 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git add README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "stats: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
