name: odometer
on:
  schedule:
    - cron: "0 12,20 * * *"   # 12:00+20:00 UTC = 16:00+24:00 Georgian (UTC+4): GitHub publishes traffic ~15-18h after a day ends, so the 16:00 run captures yesterday
  workflow_dispatch: {}    # gives you a "Run workflow" button
jobs:
  refresh:
    permissions:
      contents: write       # lets the run token commit the stats back — do not remove
    uses: Caqtus/odometer/.github/workflows/odometer.yml@v1
    with:
      npm_package: "armazi-hud"
    secrets: inherit
